name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # === مرحله ۱: ساخت نسخه Standalone در سرورهای گیت‌هاب ===
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # چیدمان فایل‌ها طوری که در سرور آماده اجرا باشند
      - name: Prepare Standalone Artifact
        run: |
          # ساخت پوشه نهایی
          mkdir -p final-deploy/.next
          
          # کپی کردن فایل اجرایی و وابستگی‌های ضروری (این فایل‌ها خیلی سبک‌تر از node_modules کامل هستند)
          cp -r .next/standalone/* final-deploy/
          
          # کپی کردن فایل‌های استاتیک (CSS/JS) به جای درست
          cp -r .next/static final-deploy/.next/static
          
          # کپی کردن پوشه public (عکس‌ها و فونت‌ها)
          cp -r public final-deploy/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: final-deploy/
          retention-days: 1

  # === مرحله ۲: دیپلوی در سرور ویندوزی شما ===
  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: powershell

    steps:
      - name: Clean Destination
        run: |
          Remove-Item * -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaned previous files."

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .

      # === بخش جدید: ساخت فایل web.config برای IIS ===
      - name: Create web.config
        run: |
          $content = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:3000/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path ".\web.config" -Value $content
          Write-Host "web.config created successfully."

      # === اجرای برنامه با PM2 (npx) ===
      - name: Restart PM2
        run: |
          $appName = "next-app"
          
          # اگر PM2 در مسیر نبود با npx اجراش کن
          if (npx pm2 list | Select-String $appName) {
              Write-Host "Reloading app..."
              npx pm2 reload $appName --update-env
          } else {
              Write-Host "Starting app..."
              npx pm2 start server.js --name $appName
          }
          npx pm2 save
