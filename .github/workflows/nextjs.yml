name: Build on GitHub, Deploy to Self-Hosted

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare Artifacts
        run: |
          # ساخت پوشه مقصد به صورت کامل
          mkdir -p deploy-package/.next

          # کپی فایل‌های اصلی سرور
          cp -r .next/standalone/* deploy-package/

          # کپی فایل‌های استاتیک (نکته: -p در mkdir بالا باعث می‌شود ارور ندهد)
          cp -r .next/static deploy-package/.next/static

          # کپی فایل‌های عمومی
          cp -r public deploy-package/public

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy-package/
          retention-days: 1

    deploy:
    needs: build
    runs-on: self-hosted
    
    # تغییر مهم: استفاده از powershell به جای pwsh
    defaults:
      run:
        shell: powershell

    steps:
      # 1. پاک کردن فایل‌های قبلی
      # نکته: اگر فایل‌ها توسط PM2 قفل شده باشند، ممکن است خطا بدهد
      # دستور زیر سعی می‌کند پاک کند ولی اگر خطایی بود نادیده می‌گیرد تا پروسه متوقف نشود
      - name: Clean working directory
        run: |
          Remove-Item * -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaning attempted."

      # 2. دانلود فایل‌های بیلد شده
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      # 3. اجرای پروژه با PM2
      - name: Restart PM2
        run: |
          $appName = "next-app"
          $env:PORT = "3000"
          
          # چک کردن نصب PM2
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
              Write-Host "PM2 not found. Installing..."
              npm install -g pm2
          }

          # چک کردن وضعیت برنامه
          $pm2Status = pm2 list
          # دستور Select-String در پاورشل معادل grep است
          if ($pm2Status | Select-String $appName) {
              Write-Host "App is running. Reloading..."
              # ریلود بدون دان‌تایم
              pm2 reload $appName --update-env
          } else {
              Write-Host "App is not running. Starting..."
              # استارت اولیه
              pm2 start server.js --name $appName
          }
          
          pm2 save
          
          # ذخیره وضعیت برای ریستارت سرور
          pm2 save
