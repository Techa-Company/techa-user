name: Build on GitHub, Deploy to Self-Hosted

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # === مرحله اول: بیلد روی سرورهای گیت‌هاب ===
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # آماده‌سازی فایل‌ها برای انتقال به سرور شما
      # در حالت standalone پوشه‌های static و public داخل پکیج نیستند و باید دستی کپی شوند
      - name: Prepare Artifacts
        run: |
          mkdir deploy-package
          cp -r .next/standalone/* deploy-package/
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public

      # آپلود فایل‌های نهایی برای استفاده در مرحله بعد
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy-package/
          retention-days: 1

  # === مرحله دوم: دیپلوی روی سرور شما ===
  deploy:
    needs: build # منتظر می‌ماند تا بیلد تمام شود
    runs-on: self-hosted # روی رانر سرور خودتان اجرا می‌شود
    
    steps:
      # پاک کردن فایل‌های قبلی (اختیاری ولی تمیزتر است)
      - name: Clean working directory
        run: rm -rf ./*

      # دانلود فایل‌هایی که در مرحله قبل ساخته شد
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      # اجرای پروژه با PM2
      # در حالت standalone فایل اصلی server.js است نه npm start
      - name: Restart PM2
        run: |
          APP_NAME="next-app"
          
          # اگر PM2 نصب نیست، نصبش کن (فقط بار اول)
          if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
          fi

          if pm2 list | grep -q "$APP_NAME"; then
            echo "App is running, reloading..."
            pm2 reload $APP_NAME
          else
            echo "App is not running, starting..."
            # پورت را اینجا مشخص کنید (مثلا 3000)
            PORT=3000 pm2 start server.js --name "$APP_NAME"
          fi
          
          pm2 save
