name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # === اصلاح شده: زیپ کردن صحیح ===
      - name: Prepare and Zip Artifact
        run: |
          # 1. ساخت پوشه static در مسیر standalone
          mkdir -p .next/standalone/.next/static
          
          # 2. کپی فایل‌های استاتیک و عمومی
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/public
          
          # 3. وارد پوشه standalone می‌شویم و زیپ می‌کنیم
          cd .next/standalone
          
          # نکته مهم: اینجا باید 2 مرحله برگردیم عقب (../../) تا فایل زیپ در ریشه پروژه بیفتد
          zip -r ../../deploy-package.zip .

      # برای اطمینان لیست فایل‌ها را چاپ می‌کنیم تا ببینیم فایل زیپ ساخته شده یا نه
      - name: Check Zip File Exists
        run: ls -lh deploy-package.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: powershell

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: .

      - name: Deploy to Server
        run: |
          $TargetFolder = "C:\inetpub\wwwroot\next-app"
          $ZipPath = ".\deploy-package.zip"
          
          # 1. توقف PM2 اگر قبلاً اجرا شده
          Write-Host "Stopping PM2..."
          if (Get-Command npx -ErrorAction SilentlyContinue) {
              npx pm2 stop next-app --silent
              npx pm2 delete next-app --silent
          }

          # 2. آماده‌سازی پوشه مقصد
          if (-not (Test-Path $TargetFolder)) {
              New-Item -ItemType Directory -Path $TargetFolder -Force
          }

          # 3. پاک‌سازی فایل‌های قدیمی
          Write-Host "Cleaning destination..."
          Remove-Item "$TargetFolder\*" -Recurse -Force -ErrorAction SilentlyContinue

          # 4. اکسترکت کردن فایل زیپ
          Write-Host "Extracting Zip..."
          Expand-Archive -Path $ZipPath -DestinationPath $TargetFolder -Force

          # 5. ساخت فایل web.config برای IIS
          $webConfig = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:3000/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path "$TargetFolder\web.config" -Value $webConfig

          # 6. اجرای برنامه با PM2
          Set-Location $TargetFolder
          
          Write-Host "Starting app..."
          $env:PORT = 3000
          
          # دستور صحیح اجرا
          npx pm2 start server.js --name "next-app"
          npx pm2 save
          
          Write-Host "Deployment Finished Successfully!"
