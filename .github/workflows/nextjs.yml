name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare and Zip Artifact
        run: |
          # 1. ساخت ساختار پوشه‌ها
          mkdir -p .next/standalone/.next/static
          
          # 2. کپی فایل‌های استاتیک
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/public
          
          # 3. زیپ کردن از داخل پوشه standalone
          cd .next/standalone
          zip -r ../../deploy-package.zip .

      - name: Check Zip File Exists
        run: ls -lh deploy-package.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted # مطمئن شوید لیبل‌های رانر درست است (مثلا [self-hosted, windows])
    
    defaults:
      run:
        shell: powershell

    steps:
      - name: Setup Node on Windows
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: .

      - name: Deploy to Server
        run: |
          # === تنظیمات متغیرها ===
          $AppName = "next-app"
          $AppPort = 3000
          $TargetFolder = "C:\inetpub\wwwroot\$AppName"
          $ZipPath = ".\deploy-package.zip"
          
          # === 1. اصلاح مسیر PM2 (هوشمند و قطعی) ===
          Write-Host "Locating NPM Global binaries..."
          
          # از خود NPM می‌پرسیم پکیج‌ها کجا نصب شده‌اند (این روی هر رانری جواب می‌دهد)
          $NpmPrefix = (npm config get prefix).Trim()
          Write-Host "NPM Prefix found at: $NpmPrefix"
          
          # اضافه کردن مسیر به Session جاری
          $env:Path += ";$NpmPrefix"
          
          # بررسی وجود PM2 و ساخت Alias در صورت نیاز
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
              $PM2Path = Join-Path $NpmPrefix "pm2.cmd"
              if (Test-Path $PM2Path) {
                  Write-Host "Setting alias for PM2..."
                  Set-Alias pm2 $PM2Path
              } else {
                  Write-Warning "Global PM2 cmd not found. Using local fallback to npx."
                  function pm2 { npx pm2 $args }
              }
          }
          # -------------------------------------------------------

          # === 2. حذف پروسه قبلی ===
          Write-Host "Managing PM2 Process for $AppName..."
          
          # استفاده از delete به جای kill (امن‌تر)
          pm2 delete $AppName --silent
          # جلوگیری از ارور اگر بار اول است
          $LASTEXITCODE = 0 

          # === 3. پاکسازی پوشه مقصد ===
          if (-not (Test-Path $TargetFolder)) {
              New-Item -ItemType Directory -Path $TargetFolder -Force
          }

          Write-Host "Cleaning destination folder..."
          Remove-Item "$TargetFolder\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Extracting Zip..."
          Expand-Archive -Path $ZipPath -DestinationPath $TargetFolder -Force

          # === 4. تنظیم Web.Config ===
          $webConfig = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy_$AppName" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:$AppPort/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
              <defaultDocument>
                <files>
                  <clear />
                  <add value="server.js" />
                </files>
              </defaultDocument>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path "$TargetFolder\web.config" -Value $webConfig

          # رفتن به داخل پوشه برای نصب ماژول‌ها
          Set-Location $TargetFolder
          
          # === 5. حل مشکل Sharp ===
          Write-Host "Reinstalling Sharp for Windows..."
          if (Test-Path "node_modules\sharp") {
              Remove-Item "node_modules\sharp" -Recurse -Force
          }
          # نصب سریع بدون تغییر package.json
          npm install sharp --no-save

          # === 6. اجرای نهایی با PM2 ===
          Write-Host "Starting app on port $AppPort..."
          $env:PORT = $AppPort
          
          # --cwd: اجرای پروژه به صورت ایزوله در پوشه خودش
          pm2 start server.js --name "$AppName" --cwd "$TargetFolder" --time --force
          
          # ذخیره لیست پروسه‌ها
          pm2 save --force | Out-Null
          
          Write-Host "Deployment Completed Successfully!"
          pm2 show "$AppName"
