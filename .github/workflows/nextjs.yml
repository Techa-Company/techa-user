name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # اصلاح شده: کپی دقیق تمام فایل‌های مورد نیاز
      - name: Prepare Standalone Artifact
        run: |
          # ساخت پوشه نهایی
          mkdir -p final-deploy
          
          # 1. کپی کردن کل محتویات standalone (با استفاده از /. همه فایل‌های مخفی مثل .next هم کپی می‌شوند)
          cp -r .next/standalone/. final-deploy/
          
          # 2. کپی کردن فایل‌های استاتیک (چون در standalone نیستند)
          # پوشه مقصد باید وجود داشته باشد (از مرحله قبل آمده)
          mkdir -p final-deploy/.next/static
          
          # کپی محتویات استاتیک به جای درست
          cp -r .next/static/* final-deploy/.next/static/
          
          # 3. کپی کردن پوشه public
          cp -r public final-deploy/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: final-deploy/
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: powershell

    steps:
      # 1. دانلود فایل‌ها در پوشه موقت رانر
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: ./temp-artifact

      # 2. انتقال فایل‌ها به پوشه اصلی IIS و تنظیمات نهایی
      - name: Deploy to IIS Folder
        run: |
          # --- تنظیمات: مسیر سایت در سرور را اینجا وارد کنید ---
          $TargetFolder = "C:\inetpub\wwwroot\next-app" 
          $AppName = "next-app"
          
          # اگر پوشه مقصد وجود ندارد، آن را بساز
          if (-not (Test-Path -Path $TargetFolder)) {
              New-Item -ItemType Directory -Path $TargetFolder -Force
          }

          # قبل از کپی، باید پروسه قبلی را متوقف کنیم تا فایل‌ها قفل نباشند
          Write-Host "Stopping existing PM2 process..."
          npx pm2 stop $AppName --silent
          npx pm2 delete $AppName --silent
          
          # پاک کردن فایل‌های قدیمی در مقصد (به جز web.config اگر بخواهید بماند)
          Write-Host "Cleaning destination folder..."
          Remove-Item "$TargetFolder\*" -Recurse -Force -ErrorAction SilentlyContinue

          # کپی کردن فایل‌های جدید از پوشه موقت به پوشه IIS
          Write-Host "Copying new files to IIS folder..."
          Copy-Item -Path ".\temp-artifact\*" -Destination $TargetFolder -Recurse -Force

          # رفتن به مسیر اصلی سایت
          Set-Location $TargetFolder

          # ساخت فایل web.config در مسیر اصلی
          $content = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:3000/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path ".\web.config" -Value $content
          Write-Host "web.config created."

          # اجرای مجدد برنامه با PM2 از داخل پوشه اصلی
          Write-Host "Starting app with PM2..."
          $env:PORT = "3000"
          npx pm2 start server.js --name $AppName
          npx pm2 save
          
          Write-Host "Deployment Completed Successfully!"
