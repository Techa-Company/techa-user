name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # === مرحله ۱: ساخت نسخه Standalone در سرورهای گیت‌هاب ===
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # چیدمان فایل‌ها طوری که در سرور آماده اجرا باشند
      - name: Prepare Standalone Artifact
        run: |
          # ساخت پوشه نهایی
          mkdir -p final-deploy/.next
          
          # کپی کردن فایل اجرایی و وابستگی‌های ضروری (این فایل‌ها خیلی سبک‌تر از node_modules کامل هستند)
          cp -r .next/standalone/* final-deploy/
          
          # کپی کردن فایل‌های استاتیک (CSS/JS) به جای درست
          cp -r .next/static final-deploy/.next/static
          
          # کپی کردن پوشه public (عکس‌ها و فونت‌ها)
          cp -r public final-deploy/public

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: final-deploy/
          retention-days: 1

  # === مرحله ۲: دیپلوی در سرور ویندوزی شما ===
  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: powershell

    steps:
      - name: Clean Destination
        run: |
          Remove-Item * -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleaned previous files."

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .

      - name: Restart PM2
        run: |
          $appName = "next-app"
          
          # تست می‌کنیم که آیا Node کلا نصب است یا نه
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {
             Write-Error "Node.js is NOT installed or not in PATH. Please install Node.js and Restart Runner Service."
             exit 1
          }

          # استفاده از npx به جای pm2 مستقیم
          # npx به صورت خودکار pm2 را اجرا می‌کند حتی اگر در Path سراسری نباشد
          if (npx pm2 list | Select-String $appName) {
              Write-Host "Reloading app..."
              npx pm2 reload $appName --update-env
          } else {
              Write-Host "Starting app..."
              npx pm2 start server.js --name $appName
          }
          
          npx pm2 save
