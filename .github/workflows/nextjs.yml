name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # === تغییر اساسی: آماده‌سازی و زیپ کردن ===
      - name: Prepare and Zip Artifact
        run: |
          # 1. ساخت پوشه static در مسیر standalone (نکست این کار را خودکار نمی‌کند)
          mkdir -p .next/standalone/.next/static
          
          # 2. کپی فایل‌های استاتیک و عمومی به مسیر standalone
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/public
          
          # 3. وارد پوشه standalone می‌شویم و محتویات را زیپ می‌کنیم
          # اینطوری ساختار فایل‌ها دقیقاً حفظ می‌شود
          cd .next/standalone
          zip -r ../../../app-package.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package-zip
          path: app-package.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: powershell

    steps:
      # دانلود فایل زیپ
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package-zip
          path: .

      - name: Deploy to Server
        run: |
          # --- تنظیم مسیر سایت ---
          $TargetFolder = "C:\inetpub\wwwroot\next-app"
          $ZipPath = ".\app-package.zip"
          
          # توقف پروسه قبلی (اگر در حال اجراست)
          Write-Host "Stopping PM2..."
          if (Get-Command npx -ErrorAction SilentlyContinue) {
              npx pm2 stop next-app --silent
              npx pm2 delete next-app --silent
          }

          # ساخت پوشه اگر نیست
          if (-not (Test-Path $TargetFolder)) {
              New-Item -ItemType Directory -Path $TargetFolder -Force
          }

          # پاک کردن فایل‌های قبلی در مقصد
          Write-Host "Cleaning destination..."
          Remove-Item "$TargetFolder\*" -Recurse -Force -ErrorAction SilentlyContinue

          # باز کردن فایل زیپ در مقصد
          Write-Host "Extracting Zip..."
          Expand-Archive -Path $ZipPath -DestinationPath $TargetFolder -Force

          # تنظیم وب کانفیگ IIS
          $webConfig = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:3000/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path "$TargetFolder\web.config" -Value $webConfig

          # رفتن به پوشه و اجرا
          Set-Location $TargetFolder
          
          Write-Host "Starting app..."
          $env:PORT = 3000
          
          # اجرا با PM2
          npx pm2 start server.js --name "next-app"
          npx pm2 save
          
          Write-Host "Done!"
