name: Build Standalone and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare and Zip Artifact
        run: |
          # 1. ساخت ساختار پوشه‌ها
          mkdir -p .next/standalone/.next/static
          
          # 2. کپی فایل‌های استاتیک
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/public
          
          # 3. زیپ کردن از داخل پوشه standalone
          cd .next/standalone
          zip -r ../../deploy-package.zip .

      - name: Check Zip File Exists
        run: ls -lh deploy-package.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy-package.zip
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted # مطمئن شوید لیبل‌های رانر درست است (مثلا [self-hosted, windows])
    
    defaults:
      run:
        shell: powershell

    steps:
      - name: Setup Node on Windows
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package
          path: .

      - name: Deploy to Server
        run: |
          # === تنظیمات متغیرها ===
          $AppName = "next-app"
          $AppPort = 3000
          $TargetFolder = "C:\inetpub\wwwroot\$AppName"
          $ZipPath = ".\deploy-package.zip"
          
          # === 1. اطمینان از دسترسی به PM2 گلوبال ===
          # این خط حیاتی است چون در گیت‌هاب اکشن، مسیر گلوبال NPM معمولا در Path نیست
          $env:Path += ";$env:APPDATA\npm"

          Write-Host "Checking PM2 availability..."
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
              Write-Error "PM2 is not installed globally or not found. Run 'npm install -g pm2' on the server."
              exit 1
          }

          # === 2. حذف پروسه قبلی (به جای Kill کردن کل سرور) ===
          Write-Host "Removing old process for $AppName..."
          # از kill استفاده نکنید چون همه سایت‌ها را دان می‌کند. فقط همین اپ را پاک کنید.
          pm2 delete $AppName --silent
          # اگر اپ وجود نداشت (بار اول)، ارور نده و ادامه بده:
          $LASTEXITCODE = 0 

          # === 3. پاکسازی پوشه مقصد ===
          if (-not (Test-Path $TargetFolder)) {
              New-Item -ItemType Directory -Path $TargetFolder -Force
          }

          Write-Host "Cleaning destination folder..."
          Remove-Item "$TargetFolder\*" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Extracting Zip..."
          Expand-Archive -Path $ZipPath -DestinationPath $TargetFolder -Force

          # === 4. تنظیم Web.Config ===
          $webConfig = @"
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="NextJS_Proxy_$AppName" stopProcessing="true">
                    <match url="(.*)" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="http://localhost:$AppPort/{R:1}" />
                  </rule>
                </rules>
              </rewrite>
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
              <defaultDocument>
                <files>
                  <clear />
                  <add value="server.js" />
                </files>
              </defaultDocument>
            </system.webServer>
          </configuration>
          "@
          Set-Content -Path "$TargetFolder\web.config" -Value $webConfig

          # رفتن به داخل پوشه برای نصب ماژول‌ها
          Set-Location $TargetFolder
          
          # === 5. حل مشکل Sharp ===
          Write-Host "Reinstalling Sharp for Windows..."
          if (Test-Path "node_modules\sharp") {
              Remove-Item "node_modules\sharp" -Recurse -Force
          }
          # نصب مستقیم بدون سیو در پکیج جیسون برای سرعت بیشتر
          npm install sharp --no-save

          # === 6. اجرای نهایی با PM2 ===
          Write-Host "Starting app on port $AppPort..."
          $env:PORT = $AppPort
          
          # --cwd: مهم‌ترین بخش برای ایزوله کردن پروژه
          # باعث می‌شود PM2 دقیقا در همین پوشه اجرا شود و با پروژه‌های دیگر قاطی نکند
          pm2 start server.js --name "$AppName" --cwd "$TargetFolder" --time --force
          
          # ذخیره لیست پروسه‌ها برای اینکه اگر سرور ریست شد، برنامه بالا بیاید
          pm2 save --force | Out-Null
          
          Write-Host "Deployment Completed Successfully!"
          pm2 show "$AppName"
