name: Build on GitHub, Deploy to Self-Hosted

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare Artifacts
        run: |
          # ساخت پوشه مقصد به صورت کامل
          mkdir -p deploy-package/.next

          # کپی فایل‌های اصلی سرور
          cp -r .next/standalone/* deploy-package/

          # کپی فایل‌های استاتیک (نکته: -p در mkdir بالا باعث می‌شود ارور ندهد)
          cp -r .next/static deploy-package/.next/static

          # کپی فایل‌های عمومی
          cp -r public deploy-package/public

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Clean working directory
        run: rm -rf ./*

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Restart PM2
        run: |
          APP_NAME="next-app"
          
          # نصب PM2 اگر وجود ندارد
          if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
          fi

          if pm2 list | grep -q "$APP_NAME"; then
            echo "App is running, reloading..."
            pm2 reload $APP_NAME
          else
            echo "App is not running, starting..."
            # پورت 3000
            PORT=3000 pm2 start server.js --name "$APP_NAME"
          fi
          
          pm2 save
