name: Build on GitHub, Deploy to Self-Hosted

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Prepare Artifacts
        run: |
          # ساخت پوشه مقصد به صورت کامل
          mkdir -p deploy-package/.next

          # کپی فایل‌های اصلی سرور
          cp -r .next/standalone/* deploy-package/

          # کپی فایل‌های استاتیک (نکته: -p در mkdir بالا باعث می‌شود ارور ندهد)
          cp -r .next/static deploy-package/.next/static

          # کپی فایل‌های عمومی
          cp -r public deploy-package/public

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: deploy-package/
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    
    # اینجا مشخص می‌کنیم که از PowerShell استفاده کند
    defaults:
      run:
        shell: pwsh

    steps:
      # 1. پاک کردن فایل‌های قبلی (معادل rm -rf)
      - name: Clean working directory
        run: |
          Get-ChildItem -Path . -Recurse | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          Write-Host "Directory Cleaned"

      # 2. دانلود فایل‌های بیلد شده
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      # 3. اجرای پروژه با PM2 (دستورات مخصوص پاورشل)
      - name: Restart PM2
        run: |
          $appName = "next-app"
          
          # تنظیم پورت به روش پاورشل
          $env:PORT = "3000"
          
          # نصب PM2 اگر نصب نیست
          if (-not (Get-Command pm2 -ErrorAction SilentlyContinue)) {
              Write-Host "Installing PM2..."
              npm install -g pm2
          }

          # چک کردن اینکه آیا برنامه از قبل در حال اجراست یا نه
          $pm2List = pm2 list
          if ($pm2List | Select-String $appName) {
              Write-Host "App is running, reloading..."
              pm2 reload $appName --update-env
          } else {
              Write-Host "App is not running, starting..."
              # اجرای فایل server.js
              pm2 start server.js --name $appName
          }
          
          # ذخیره وضعیت برای ریستارت سرور
          pm2 save
