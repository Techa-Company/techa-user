name: Deploy Techa

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location C:\inetpub\techa

          git config --global --add safe.directory C:/inetpub/techa

          # فایل‌های قبل از Pull
          $oldPackage = (Get-FileHash package.json).Hash
          if (Test-Path package-lock.json) {
            $oldLock = (Get-FileHash package-lock.json).Hash
          } else {
            $oldLock = ""
          }

          git fetch origin
          git reset --hard origin/main

          # فایل‌های بعد از Pull
          $newPackage = (Get-FileHash package.json).Hash
          if (Test-Path package-lock.json) {
            $newLock = (Get-FileHash package-lock.json).Hash
          } else {
            $newLock = ""
          }

          # فقط اگر وابستگی‌ها تغییر کرده باشند
          if (($oldPackage -ne $newPackage) -or ($oldLock -ne $newLock)) {
            Write-Host "Dependencies changed. Running npm install..."
            npm install
          }
          else {
            Write-Host "Dependencies unchanged. Skipping npm install."
          }

          npm run build

          & "C:\Users\Administrator\AppData\Roaming\npm\pm2.cmd" reload techa

          Start-Sleep -Seconds 5

          try {
            $response = Invoke-WebRequest http://localhost:3000 -UseBasicParsing
            if ($response.StatusCode -ne 200) {
              throw "Health check failed"
            }
          }
          catch {
            throw "Application is not responding after deployment."
          }

          Write-Host "✅ Deploy completed successfully."
